

name: Atualizar fontes jurisprudenciais

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/weekly.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 9,21 * * *'

concurrency:
  group: delta-juris-coleta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar e salvar publicacoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa"

            git fetch origin main
            git reset --hard origin/main

            python scripts/update.py

            git add data/updates.json

            if git diff --cached --quiet; then
              echo "Nenhuma alteracao encontrada"
              exit 0
            fi

            git commit -m "Atualizacao diaria de jurisprudencias"

            if git push origin main; then
              echo "Publicacoes salvas com sucesso"
              exit 0
            fi

            sleep 5
          done

          echo "Falha ao salvar apos 3 tentativas"
          exit 1
